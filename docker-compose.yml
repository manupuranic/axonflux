services:

  db:
    image: postgres:16
    container_name: axonflux-db

    env_file:
      - .env

    environment:
      POSTGRES_DB: axonflux
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./sql/raw_tables.sql:/docker-entrypoint-initdb.d/02_raw.sql
      - ./sql/derived_tables.sql:/docker-entrypoint-initdb.d/03_derived.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    ports:
      - "5432:5432"


  api:
    build: .
    container_name: axonflux-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      PYTHONPATH: /app

    volumes:
      - ./data/incoming:/app/data/incoming

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c "
      alembic upgrade head &&
      python scripts/setup_raw_triggers.py &&
      python scripts/create_admin.py &&
      uvicorn api.main:app --host 0.0.0.0 --port 8000
      "
  web:
    build: ./web
    container_name: axonflux-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api


volumes:
  pgdata: