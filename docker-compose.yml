services:
  db:
    image: postgres:16
    container_name: axonflux-db

    env_file:
      - .env

    environment:
      POSTGRES_DB: axonflux
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/raw_tables.sql:/docker-entrypoint-initdb.d/02_raw.sql
      - ./sql/derived_tables.sql:/docker-entrypoint-initdb.d/03_derived.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: axonflux-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      PYTHONPATH: /app
      host: db

    volumes:
      - ./data/incoming:/app/data/incoming

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c "
      alembic upgrade head &&
      python scripts/setup_raw_triggers.py &&
      uvicorn api.main:app --host 0.0.0.0 --port 8000
      "
  web:
    build:
      context: ./web
      args:
        INTERNAL_API_URL: http://api:8000   # BUILD TIME FIX
    container_name: axonflux-web
    ports:
      - "3000:3000"
    environment:
      - INTERNAL_API_URL=http://api:8000   # (optional runtime, harmless)
    depends_on:
      api:
        condition: service_started

  seed:
    build: .
    command: python scripts/demo_reset.py --yes
    depends_on:
      - db

volumes:
  pgdata:
